<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Lab</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <!-- Float Section -->
    <section class="article-section">
        <h2>My House Article</h2>

        <img src="imgages/house.jpg" alt="House">

        <p>
            This is a beautiful house with four rooms and a garage.
            It has a large garden and a comfortable living room.
            The image is floated beside the text using the CSS float property.
        </p>
    </section>

    <hr>

    <!-- Flexbox Section -->
    <section class="flex-container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
    </section>

    <hr>

    <!-- Grid Section -->
    <section class="grid-container">

        <div class="grid-box box1">1</div>
        <div class="grid-box box2">2</div>
        <div class="grid-box box3">3</div>
        <div class="grid-box box4">4</div>

    </section>

</body>
</html>
